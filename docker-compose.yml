version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: school-management-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: school-management-api
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - school-network

  api:
    build: .
    container_name: school-management-api
    restart: unless-stopped
    ports:
      - "5111:5111"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/school-management-api
      - USER_PORT=5111
      - ADMIN_PORT=5222
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - school-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5111/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:

networks:
  school-network:
    driver: bridge
