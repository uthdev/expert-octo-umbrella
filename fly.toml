# fly.toml app configuration file generated for expert-octo-umbrella on 2026-02-25T12:45:32+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'expert-octo-umbrella'
primary_region = 'jnb'

[build]

[http_service]
  internal_port = 5111
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  SERVICE_NAME = "school-management-api"
  ENV = "production"
  USER_PORT = "5111"
  ADMIN_PORT = "5222"
  RATE_LIMIT_WINDOW_MS = "900000"
  RATE_LIMIT_MAX_REQUESTS = "100"


